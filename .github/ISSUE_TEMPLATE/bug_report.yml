name: Bug report
description: Report something that is broken or behaves unexpectedly
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: List the controls or steps that reliably trigger the problem.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Firefox 142 on macOS 15
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Add screenshots, recordings, console errors, or relevant links.

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
